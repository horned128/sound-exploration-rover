[project]
name = "control-sim"
version = "0.1.0"
description = "Off-target regression tests for Sound Exploration Rover control code"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
